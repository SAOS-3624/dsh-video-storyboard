name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # apt 偶尔卡住，别让它挂 6 小时
    strategy:
      fail-fast: false      # 一个版本挂了不要取消另一个，否则看不到全貌
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install ffmpeg
        # --no-install-recommends 少装几十个可选的依赖，apt 快得多；也少一个卡住的点。
        # apt 镜像偶尔会挂住：先直接用 runner 自带的 ffmpeg；确实要装时给 update/install
        # 各自加硬超时，避免把 12 分钟的 job 预算全耗在等网络上。
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          APT_OPTS="-qq -o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo timeout 120s apt-get update $APT_OPTS || sudo timeout 120s apt-get update $APT_OPTS
          sudo timeout 180s apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: syntax check
        run: for f in src/*.js bin/*.mjs scripts/*.mjs; do node --check "$f"; done

      - name: unit + e2e tests
        run: npm test
        # test/contract.test.mjs self-skips when no local DSH install is present.

  # contract.test.mjs 默认在没有本地 DSH 安装时 self-skip —— 也就是说宿主集成那一面
  # 在 CI 里从来没真跑过。而 schema 用了宿主不认的关键字时，不是"工具不好用"，是
  # ctx.tools.register() 直接抛错、整棵插件树起不来。所以这一条单独跑，宿主包从 npm
  # 上取（@deepseek-ai/dsh-tools 是公开发布的），不依赖本地安装。
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install the real host package
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            @deepseek-ai/dsh-tools@next
          node -e "console.log('host', require('./node_modules/@deepseek-ai/dsh-tools/package.json').version)"

      - name: contract test against the real host
        env:
          DSH_TOOLS_PATH: node_modules/@deepseek-ai/dsh-tools/lib/index.js
        run: node --test test/contract.test.mjs
